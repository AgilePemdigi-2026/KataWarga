services:
  db:
    image: postgres:16-alpine
    container_name: katawarga_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-katawarga}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
